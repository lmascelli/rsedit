[workspace]

[package]
name = "rsedit"
version = "0.2.0"
edition = "2024"

[dependencies]
rsedit_core = { path = "./core" }
crossterm = "*"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true